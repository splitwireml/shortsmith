[project]
name = "shortsmith"
version = "0.1.0"
description = "Local YouTube Shorts automation app"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi",
    "uvicorn",
    "sqlmodel",
    "pydantic-settings",
    "pydantic-ai-slim[google]==2.71.0",
    "google-genai>=2.30.0,<3",
    "google-api-python-client",
    "google-auth-oauthlib",
]

[dependency-groups]
dev = ["pytest", "anyio", "httpx"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
